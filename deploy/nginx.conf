# Nginx site for the learning platform.
# Listens only on localhost; a tunnel forwards public HTTPS here.
#   - Cloudflare Tunnel (custom domain, recommended): cloudflared -> 127.0.0.1:8080
#   - Tailscale Funnel (*.ts.net only): funnel -> 127.0.0.1:8080
# Install to: /etc/nginx/sites-available/learningplatform  then symlink to sites-enabled.

server {
    # Bound to localhost only — the public entry point is a tunnel
    # (Cloudflare Tunnel or Tailscale Funnel), never a directly-open port.
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 25M;   # allow project image / file uploads

    # --- EDIT these paths to match your checkout (deployed values shown) ---
    location /static/ {
        alias /home/sean/learningPlatform/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /uploads/ {
        alias /home/sean/learningPlatform/uploads/;
        access_log off;
        expires 7d;
    }
    # ----------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # All public traffic arrives via a TLS-terminating tunnel (Cloudflare
        # Tunnel or Tailscale Funnel), so tell Django the request is HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
