# Nginx site for the learning platform.
# Listens only on localhost; Tailscale Funnel forwards public HTTPS here.
# Install to: /etc/nginx/sites-available/learningplatform  then symlink to sites-enabled.

server {
    # Bound to localhost only — the public entry point is Tailscale Funnel.
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 25M;   # allow project image / file uploads

    # --- EDIT these paths to match your checkout (deployed values shown) ---
    location /static/ {
        alias /home/sean/learningPlatform/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /uploads/ {
        alias /home/sean/learningPlatform/uploads/;
        access_log off;
        expires 7d;
    }
    # ----------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # All public traffic arrives via Tailscale Funnel (TLS), so tell Django HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
