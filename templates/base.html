<!DOCTYPE html>
<html lang="en" class="{% block html_class %}light{% endblock %}" {% if current_user_profile %}data-user-theme="{{ current_user_profile.theme }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dev Academy{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'logo.png' %}" type="image/png" sizes="32x32">
    <link href="{% static 'css/main.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    {% block extra_head %}{% endblock %}
    <script src="{% static 'js/theme.js' %}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{% static 'js/markdown.js' %}" defer></script>
    <script src="{% static 'js/collapsible.js' %}" defer></script>
    <script src="{% static 'js/file_upload.js' %}" defer></script>
    <script src="{% static 'js/notifications.js' %}" defer></script>
</head>
<body class="{% block body_class %}bg-background text-on-background{% endblock %}">
    {% if messages %}
    <div class="fixed top-4 right-4 z-50 space-y-2">
        {% for message in messages %}
        <div class="px-4 py-3 rounded-lg shadow-lg {% if message.tags == 'error' %}bg-error-container text-on-error-container{% else %}bg-secondary-container text-on-secondary-container{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
