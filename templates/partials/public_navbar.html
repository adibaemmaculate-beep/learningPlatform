<header class="fixed top-0 w-full z-50 bg-surface-container-lowest border-b border-surface-variant shadow-sm">
    <div class="max-w-[1280px] mx-auto px-gutter h-16 flex justify-between items-center">
        <a href="{% url 'public:home' %}" class="flex items-center gap-3">
            {% include "partials/site_logo.html" with css_class="h-6 w-auto max-w-[110px]" %}
        </a>
        <nav class="hidden md:flex items-center gap-8">
            <a href="{% url 'public:home' %}" class="font-label-md text-label-md {% if active_public_nav == 'home' %}text-primary border-b-2 border-secondary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors">Home</a>
            <a href="{% url 'public:about' %}" class="font-label-md text-label-md {% if active_public_nav == 'about' %}text-primary border-b-2 border-secondary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors">About</a>
            <a href="{% url 'public:students' %}" class="font-label-md text-label-md {% if active_public_nav == 'students' %}text-primary border-b-2 border-secondary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors">Meet the Students</a>
            <a href="{% url 'public:updates' %}" class="font-label-md text-label-md {% if active_public_nav == 'updates' %}text-primary border-b-2 border-secondary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors">Updates</a>
            <a href="{% url 'public:contact' %}" class="font-label-md text-label-md {% if active_public_nav == 'contact' %}text-primary border-b-2 border-secondary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors">Contact</a>
        </nav>
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
            <a href="{{ user.get_portal_home_url }}" class="bg-secondary-container text-primary font-label-md px-6 py-2 rounded hover:bg-secondary-fixed transition-colors font-bold">My Portal</a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="bg-secondary-container text-primary font-label-md px-6 py-2 rounded hover:bg-secondary-fixed transition-colors font-bold">Log In</a>
            {% endif %}
        </div>
    </div>
</header>
